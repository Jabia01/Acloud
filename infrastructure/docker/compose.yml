name: media-backup-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: 3001
      NODE_ENV: development
      DEV_MAIL_ENABLED: "true"
      DEV_SMTP_HOST: mail
      WEB_BASE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    command: ["sh", "-c", "node scripts/migrate.mjs && node apps/api/dist/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  mail:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  database-data:

name: media-backup-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: 3001
      NODE_ENV: development
      DEV_MAIL_ENABLED: "true"
      DEV_SMTP_HOST: mail
      WEB_BASE_URL: http://localhost:3000
      S3_ENDPOINT: http://storage:9000
      # Host-facing URL must be signed separately from the container endpoint.
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run storage:configure}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run storage:configure}
      S3_BUCKET: ${S3_BUCKET:-backup-dev-objects}
      S3_REGION: ${S3_REGION:-us-east-1}
      FREE_DEV_QUOTA_BYTES: ${FREE_DEV_QUOTA_BYTES:-20971520}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      UPLOAD_TTL_SECONDS: ${UPLOAD_TTL_SECONDS:-300}
      DOWNLOAD_TTL_SECONDS: ${DOWNLOAD_TTL_SECONDS:-60}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "node scripts/migrate.mjs && node apps/api/dist/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  mail:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  storage:
    build:
      context: ../..
      dockerfile: infrastructure/docker/storage.Dockerfile
    image: media-backup-storage-dev:2025-10-15
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run storage:configure}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run storage:configure}
      MINIO_BROWSER: "off"
    command: ["server", "/data", "--address", ":9000"]
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  storage-init:
    image: media-backup-storage-dev:2025-10-15
    entrypoint: ["/usr/local/bin/storage-init"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run storage:configure}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run storage:configure}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run storage:configure}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run storage:configure}
      S3_BUCKET: ${S3_BUCKET:-backup-dev-objects}
    depends_on:
      storage:
        condition: service_healthy
volumes:
  database-data:
  object-data:

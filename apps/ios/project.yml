# Generate with XcodeGen on macOS: xcodegen generate
name: BackupClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  MediaPreservation:
    path: Packages/MediaPreservation
  RestoreEngine:
    path: Packages/RestoreEngine
  LocalStorageManagement:
    path: Packages/LocalStorageManagement
  HealthClient:
    path: Packages/HealthClient
  PhotoDiscovery:
    path: Packages/PhotoDiscovery
  BackupEngine:
    path: Packages/BackupEngine
  UploadFoundation:
    path: Packages/UploadFoundation
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: BackupClient
    PRODUCT_BUNDLE_IDENTIFIER: com.example.backupclient.dev
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      API_BASE_URL: https://api-staging.useacloud.com
      STORAGE_ORIGIN: https://s3.eu-central-003.backblazeb2.com
      PRODUCT_DISPLAY_NAME: Acloud
    Release:
      API_BASE_URL: $(BETA_API_BASE_URL)
      STORAGE_ORIGIN: $(BETA_STORAGE_ORIGIN)
      PRODUCT_BUNDLE_IDENTIFIER: $(BETA_BUNDLE_IDENTIFIER)
      DEVELOPMENT_TEAM: $(BETA_DEVELOPMENT_TEAM)
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 12
      PRODUCT_DISPLAY_NAME: Acloud
targets:
  BackupClient:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HealthClient
      - package: PhotoDiscovery
        product: DiscoveryCore
      - package: PhotoDiscovery
        product: PhotoKitDiscovery
      - package: UploadFoundation
      - package: BackupEngine
      - package: MediaPreservation
      - package: RestoreEngine
      - package: LocalStorageManagement
    settings:
      configs:
        Release:
          INFOPLIST_FILE: Configuration/Info-Beta.plist
          GENERATE_INFOPLIST_FILE: NO
    configFiles:
      Release: Configuration/Beta.xcconfig
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        APIBaseURL: $(API_BASE_URL)
        StorageOrigin: $(STORAGE_ORIGIN)
        DevelopmentSinglePhotoRestore: true
        DevelopmentSinglePhotoBackup: true
        DevelopmentComplexMediaBackup: true
        BackgroundUploadsEnabled: true
        EnableFreeUpSpace: false
        DisposableCleanupContext: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Connect to the development backend on your local network.
        NSPhotoLibraryAddUsageDescription: Save explicitly selected and verified protected versions as new Photos items; these may sync through iCloud Photos.
        NSPhotoLibraryUsageDescription: Review photo and video metadata. Any future development cleanup requires your explicit confirmation and may affect iCloud Photos. Customer-media cleanup is disabled.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BackupEngineSimulatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Packages/BackupEngine/Tests/BackupEngineTests]
    dependencies:
      - package: BackupEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BackupClient:
    build:
      targets:
        BackupClient: all
    run:
      config: Debug

  BackupEngineSimulator:
    build:
      targets:
        BackupEngineSimulatorTests: all
    test:
      targets:
        - BackupEngineSimulatorTests
